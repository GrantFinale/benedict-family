name: Sync YouTube videos

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling on every run resets that clock, so the sync keeps
      # running through long gaps between uploads.
      - name: Keep the daily schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/sync-youtube.yml/enable"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update video catalog from YouTube
        run: node scripts/sync-youtube.mjs
      - name: Commit new uploads
        run: |
          if git diff --quiet -- videos.json; then
            echo "Video catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Update YouTube video catalog"
          git push
